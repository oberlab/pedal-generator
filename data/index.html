<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101a17">
    <title>Pedal-Kino</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header class="app-header">
      <div class="header-start">
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Navigation öffnen"><span></span><span></span><span></span></button>
        <a class="brand" href="#overview" aria-label="Pedal-Kino Übersicht">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span><strong>Pedal-Kino</strong><small>Energie gemeinsam erleben</small></span>
        </a>
      </div>
      <div id="connection-status" class="connection-status" data-state="connecting">
        <span class="status-dot"></span><span class="status-label">Verbinde …</span>
      </div>
    </header>

    <nav id="main-navigation" class="view-nav" aria-label="Ansicht wählen">
      <button type="button" data-view="overview" class="active">Übersicht</button>
      <button type="button" data-view="bike-1">Bike 1</button>
      <button type="button" data-view="bike-2">Bike 2</button>
      <button type="button" data-view="bike-3">Bike 3</button>
      <button type="button" data-view="bike-4">Bike 4</button>
      <button type="button" data-view="ranking">Rangliste</button>
    </nav>

    <main>
      <section id="view-overview" class="view active" aria-label="Übersicht">
        <div class="system-grid">
          <article class="battery-card panel">
            <div id="battery-flow-gauge" class="battery-flow-gauge"></div>
            <div class="battery-copy">
              <span id="flow-badge" class="flow-badge" data-state="unknown">Sensor nicht kalibriert</span>
              <h2><span id="battery-power">–</span> W</h2>
              <p><span id="battery-voltage">–</span> V · <span id="battery-current">–</span> A</p>
            </div>
          </article>

          <article class="metric-card panel">
            <span class="metric-icon generated" aria-hidden="true">↗</span>
            <div><small>Gerade erzeugt</small><strong><span id="generated-power">0</span> W</strong></div>
          </article>
          <article class="metric-card panel">
            <span class="metric-icon consumed" aria-hidden="true">▶</span>
            <div><small>Verbrauch Beamer</small><strong><span id="load-power">0</span> W</strong></div>
          </article>
        </div>

        <div id="bike-grid" class="bike-grid"></div>
      </section>

      <section id="view-bike" class="view" aria-live="polite">
        <div id="bike-detail"></div>
      </section>

      <section id="view-ranking" class="view" aria-labelledby="ranking-title">
        <div class="section-heading compact-heading">
          <div><p class="eyebrow">Alle Fahrer</p><h1 id="ranking-title">Rangliste</h1></div>
          <button id="reset-ranking" class="ranking-reset" type="button">Rangliste zurücksetzen</button>
        </div>
        <div id="ranking-list" class="ranking-list"></div>
      </section>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
