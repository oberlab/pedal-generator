[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:tools/download_calibration.py
custom_calibration_url = http://192.168.4.1/calibration.json
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3
  ESP32Async/AsyncTCP @ ^3.4.10
  ESP32Async/ESPAsyncWebServer @ ^3.11.2
build_flags =
  -D CORE_DEBUG_LEVEL=1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.10.31
custom_calibration_url = http://192.168.10.31/calibration.json
upload_flags =
  --auth=pedalkino
  --timeout=60
